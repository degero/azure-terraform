name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # for private repo
      security-events: write
    strategy:
      max-parallel: 1 # run dev before test, and only if dev passes
      matrix:
        environment: ${{ fromJSON(vars.TF_ENVIRONMENTS) }}
    uses: ./.github/workflows/tf-validate.yml
    with:
      environment: ${{ matrix.environment }}
      # Checkov is run on created tfplan files during main branch trigger
      - name: Checkov Terraform (whole repo)
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: Checkov Terraform
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 #v12.3123.0
        with:
          directory: ./
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: Upload SARIF file
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov
