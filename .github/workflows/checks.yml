name: Checks

on:
  workflow_call:

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        name: Checkov Terraform
        with:
          directory: ./
          framework: terraform

      - name: Terraform Validate
        working-directory: ./
        run: terraform validate
