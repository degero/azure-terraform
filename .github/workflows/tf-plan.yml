name: Terraform Plan

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        type: string
        default: "dev"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      WORKING_DIR: ./environments/${{ inputs.environment }}
      TFPLAN_STORAGE_ACCOUNT: ${{ vars.TF_PLAN_STORAGE_ACCOUNT }}
      TF_INPUT: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tf-init
        with:
          working_directory: ${{ env.WORKING_DIR }}
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -var-file=terraform.tfvars -out=tfplan
      - name: Terraform Output to PR
        if: always() && github.event_name == 'pull_request' && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: actions/github-script@v9
        env:
          TFPLAN_OUTPUT: "${{ format('{0}{1}', steps.plan.outputs.stdout, steps.plan.outputs.stderr) }}"
        with:
          github-token: ${{ secrets.TFPLAN_OUTPUT }}
          script: |
            const body = `${process.env.SUMMARY}`;
            github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
            })
      # TODO remove
      # - name: Post Plan
      #   if: always() && github.event_name == 'pull_request' && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
      #   uses: robburger/terraform-pr-commenter@72c6e45eced6641488a6cf3ff104b7b9bda9c66c #v1.5.0
      #   with:
      #     commenter_type: plan
      #     commenter_input: ${{ format('{0}{1}', steps.plan.outputs.stdout, steps.plan.outputs.stderr) }}
      #     commenter_exitcode: ${{ steps.plan.outputs.exitcode }}
      - name: Convert plan to JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload plan to blob storage
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ vars.TF_PLAN_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ github.repository }}/${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}/tfplan" \
            --file tfplan \
            --overwrite
      - name: Checkov scan (plan)
        uses: bridgecrewio/checkov-action@master
        with:
          file: ${{ env.WORKING_DIR }}/tfplan.json
          framework: terraform_plan
          soft_fail: false
          output_format: cli,sarif # sarif enables GitHub code scanning integration
          output_file_path: console,results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov
