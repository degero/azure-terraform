name: Terraform Plan

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        type: string
        default: "dev"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: "true"
  WORKING_DIR: ./environments/${{ inputs.environment }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-init
        with:
          working_directory: ${{ env.WORKING_DIR }}
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -var-file="${{ inputs.environment }}.tfvars" -out=tfplan
      - name: Post Plan
        if: always() && github.event_name == 'pull_request' && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: robburger/terraform-pr-commenter@72c6e45eced6641488a6cf3ff104b7b9bda9c66c # v1.5.0
        with:
          commenter_type: plan
          commenter_input: ${{ format('{0}{1}', steps.plan.outputs.stdout, steps.plan.outputs.stderr) }}
          commenter_exitcode: ${{ steps.plan.outputs.exitcode }}
      - name: Convert plan to JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json
      # If extra audit trail needed but sec risk
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ inputs.environment }}-tfplan
      #     path: ${{ env.WORKING_DIR }}/tfplan
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ inputs.environment }}-tfplan-json
      #     path: ${{ env.WORKING_DIR }}/tfplan.json
      - name: Checkov scan (plan)
        uses: bridgecrewio/checkov-action@master
        with:
          file: ${{ env.WORKING_DIR }}/tfplan.json
          framework: terraform_plan
          soft_fail: false
          output_format: cli,sarif # sarif enables GitHub code scanning integration
          output_file_path: console,results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
