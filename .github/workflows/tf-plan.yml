name: Terraform Plan

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        type: string
        default: "dev"
    outputs:
      plan_blob_name:
        value: ${{ jobs.plan.outputs.plan_blob_name }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    outputs:
      plan_blob_name: ${{ steps.plan_path.outputs.plan_blob_name }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      WORKING_DIR: ./environments/${{ inputs.environment }}
      TFPLAN_STORAGE_ACCOUNT: ${{ vars.TF_PLAN_STORAGE_ACCOUNT }}
      TF_INPUT: 0

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tf-init
        with:
          working_directory: ${{ env.WORKING_DIR }}

      - name: Terraform plan blob name
        id: plan_path
        run: echo "plan_blob_name=${{ github.repository }}/${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}/tfplan" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Convert plan to JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json

      # Build a short, non-sensitive summary: resource address + action only.
      # Never touches attribute values, so tags/IPs/keys etc. never leak into the PR.
      - name: Build plan summary
        id: plan_summary
        working-directory: ${{ env.WORKING_DIR }}
        run: | # TODO refac to scripts folder
          jq -r '
            def sym(a):
              if a == ["create"] then "🟢 add"
              elif a == ["update"] then "🟡 change"
              elif a == ["delete"] then "🔴 destroy"
              elif (a == ["create","delete"]) or (a == ["delete","create"]) then "♻️ replace"
              else "• " + (a | join(",")) end;

            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ($changes | map(select(.change.actions == ["create"])) | length) as $add
            | ($changes | map(select(.change.actions == ["update"])) | length) as $change
            | ($changes | map(select(.change.actions == ["delete"])) | length) as $destroy
            | ($changes | map(select((.change.actions == ["create","delete"]) or (.change.actions == ["delete","create"]))) | length) as $replace
            | "**Plan summary:** \($add) to add, \($change) to change, \($destroy) to destroy" +
              (if $replace > 0 then ", \($replace) to replace" else "" end),
              "",
              (if ($changes | length) == 0 then "_No resource changes._"
               else ($changes[] | "- \(sym(.change.actions)) `\(.address)`") end)
          ' tfplan.json > plan_summary.md

      - name: PR comment (marocchino)
        if: ${{ vars.USE_ALTERNATE_PR_COMMENT }} == 'true' && always() && github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: "terraform-plan-marocchino-${{ inputs.environment }}"
          path: ${{ env.WORKING_DIR }}/plan_summary.md

      - name: PR comment (borchero)
        if: ${{ vars.USE_ALTERNATE_PR_COMMENT }} == 'false' && always() && github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: tfplan
          working-directory: ${{ env.WORKING_DIR }}
          header: "🧪 Terraform Plan (borchero) — ${{ inputs.environment }}"

      # Neither action above has anything to parse when `terraform plan` fails
      - name: PR comment on plan failure
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          TFPLAN_RAW: "${{ format('{0}{1}', steps.plan.outputs.stdout, steps.plan.outputs.stderr) }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = `<!-- terraform-plan-comment: ${{ inputs.environment }} -->`;
            const raw = process.env.TFPLAN_RAW || '';
            const tail = raw.split('\n').slice(-40).join('\n');
            const body = `${marker}\n## ❌ Terraform Plan failed — \`${{ inputs.environment }}\`\n\n\`\`\`\n${tail}\n\`\`\`\n\n<sub>Run: [${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId})</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload plan to blob storage
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ vars.TF_PLAN_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ steps.plan_path.outputs.plan_blob_name }}" \
            --file tfplan \
            --overwrite

      - name: Checkov Terraform (tfplan)
        uses: bridgecrewio/checkov-action@master
        with:
          file: ${{ env.WORKING_DIR }}/tfplan.json
          framework: terraform_plan
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov
