name: Generate Terraform Diagram

permissions: {}

on:
  push:
    branches: [main] #This will just find the highest tf env in /environments/<env> and generate 1 diagram
  workflow_dispatch:
    inputs:
      terraform-directory:
        description: "Path to the Terraform root module"
        required: false
        type: string
        default: "."
      docs-path:
        description: "Directory (relative to repo root) to write the diagram into"
        required: false
        type: string
        default: "docs"
      diagram-filename:
        description: "Output filename for the rendered diagram"
        required: false
        type: string
        default: "terraform-diagram.svg"
      commit-changes:
        description: "Whether to commit the generated diagram/README changes back to the repo"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      terraform-directory:
        description: "Path to the Terraform root module"
        required: false
        type: string
        default: "."
      docs-path:
        description: "Directory (relative to repo root) to write the diagram into"
        required: false
        type: string
        default: "docs"
      diagram-filename:
        description: "Output filename for the rendered diagram"
        required: false
        type: string
        default: "terraform-diagram.svg"
      commit-changes:
        description: "Whether to commit the generated diagram/README changes back to the repo"
        required: false
        type: boolean
        default: true

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # `inputs.*` are empty on push events, so every value used later is
      # resolved here (push defaults vs. dispatch/call inputs) and exposed as a step output.
      - name: Resolve diagram configuration
        id: diagram_config
        shell: bash
        env:
          TF_ENVIRONMENTS: ${{ vars.TF_ENVIRONMENTS }}
          INPUT_TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
          INPUT_DOCS_PATH: ${{ inputs.docs-path }}
          INPUT_DIAGRAM_FILENAME: ${{ inputs.diagram-filename }}
          INPUT_COMMIT_CHANGES: ${{ inputs.commit-changes }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            environment="$(python3 -c 'import json, os; print(json.loads(os.environ["TF_ENVIRONMENTS"])[-1])')"
            if [[ "$environment" == environments/* ]]; then
              terraform_directory="$environment"
            else
              terraform_directory="environments/$environment"
            fi
            docs_path="docs"
            diagram_filename="${environment##*/}-terraform-diagram.svg"
            commit_changes="true"
          else
            terraform_directory="${INPUT_TERRAFORM_DIRECTORY:-.}"
            docs_path="${INPUT_DOCS_PATH:-docs}"
            diagram_filename="${INPUT_DIAGRAM_FILENAME:-terraform-diagram.svg}"
            commit_changes="${INPUT_COMMIT_CHANGES:-true}"
          fi

          if [[ -z "$terraform_directory" ]]; then
            echo "::error::terraform_directory resolved to an empty value. Check that the TF_ENVIRONMENTS repo variable exists and is valid JSON, e.g. [\"dev\",\"prod\"]."
            exit 1
          fi

          echo "terraform_directory=$terraform_directory" >> "$GITHUB_OUTPUT"
          echo "docs_path=$docs_path" >> "$GITHUB_OUTPUT"
          echo "diagram_filename=$diagram_filename" >> "$GITHUB_OUTPUT"
          echo "commit_changes=$commit_changes" >> "$GITHUB_OUTPUT"

          echo "terraform_directory='$terraform_directory'"
          echo "docs_path='$docs_path'"
          echo "diagram_filename='$diagram_filename'"
          echo "commit_changes='$commit_changes'"

      - uses: ./.github/actions/tf-setup

      # `terraform graph` needs an initialized backend, so `init -backend=false` is not enough.
      # Swap whatever backend is configured for a local one (runner-only file, never committed),
      # so no remote state or credentials are required.
      - name: Init Terraform with local backend override (diagram only)
        working-directory: ${{ steps.diagram_config.outputs.terraform_directory }}
        run: |
          cat > backend_override.tf << 'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init -input=false

      - name: Generate Terraform graph (DOT)
        working-directory: ${{ steps.diagram_config.outputs.terraform_directory }}
        run: terraform graph > graph.dot

      - name: Convert DOT graph to Mermaid syntax
        run: |
          python3 - "${{ steps.diagram_config.outputs.terraform_directory }}/graph.dot" > diagram.mmd << 'PYEOF'
          import re, sys

          dot_path = sys.argv[1]
          with open(dot_path) as f:
              dot = f.read()

          # Extract edges of the form: "node_a" -> "node_b"
          edge_re = re.compile(r'"([^"]+)"\s*->\s*"([^"]+)"')
          edges = edge_re.findall(dot)

          def clean(label: str) -> str:
              # Strip terraform graph noise, keep resource address readable
              label = label.split(" (expand)")[0]
              label = re.sub(r'[^A-Za-z0-9_\.\[\]/-]', '_', label)
              return label

          def node_id(label: str) -> str:
              return re.sub(r'[^A-Za-z0-9_]', '_', label)

          print("flowchart LR")
          seen_nodes = set()
          for src, dst in edges:
              src_c, dst_c = clean(src), clean(dst)
              src_id, dst_id = node_id(src_c), node_id(dst_c)
              for nid, label in ((src_id, src_c), (dst_id, dst_c)):
                  if nid not in seen_nodes:
                      seen_nodes.add(nid)
                      print(f'    {nid}["{label}"]')
              print(f"    {src_id} --> {dst_id}")
          PYEOF

      - name: Install mermaid-cli (mermaid engine built from mermaid-js/mermaid@main)
        run: |
          mkdir -p /tmp/mermaid-render
          cd /tmp/mermaid-render
          cat > package.json << 'EOF'
          {
            "name": "mermaid-render",
            "private": true,
            "dependencies": {
              "@mermaid-js/mermaid-cli": "github:mermaid-js/mermaid-cli#db1ceebbe529d7975474eb0d0e9c23e9dc57cd37"
            }
          }
          EOF
          npm install --no-fund --no-audit

      - name: Render diagram to SVG
        env:
          DOCS_PATH: ${{ steps.diagram_config.outputs.docs_path }}
          DIAGRAM_FILENAME: ${{ steps.diagram_config.outputs.diagram_filename }}
        run: |
          mkdir -p "$DOCS_PATH"
          /tmp/mermaid-render/node_modules/.bin/mmdc \
            -i diagram.mmd \
            -o "$DOCS_PATH/$DIAGRAM_FILENAME" \
            -b transparent

      - name: Ensure README references the diagram
        env:
          DOCS_PATH: ${{ steps.diagram_config.outputs.docs_path }}
          DIAGRAM_FILENAME: ${{ steps.diagram_config.outputs.diagram_filename }}
        run: |
          README="$DOCS_PATH/README.md"
          # README sits next to the SVG, so link relatively
          DOC_LINK="./$DIAGRAM_FILENAME"
          MARKER="<!-- terraform-diagram:start -->"

          [ -f "$README" ] || touch "$README"

          if grep -qF "$MARKER" "$README"; then
            echo "README already has a terraform-diagram section; leaving as-is."
          else
            {
              echo "## Diagram"
              echo "$MARKER"
              echo "Auto-generated from Terraform. Do not edit manually."
              echo ""
              echo "![Terraform diagram]($DOC_LINK)"
              echo "<!-- terraform-diagram:end -->"
            } >> "$README"
            echo "Injected diagram reference into $README"
          fi

      - name: Commit changes
        if: ${{ steps.diagram_config.outputs.commit_changes == 'true' }}
        env:
          DOCS_PATH: ${{ steps.diagram_config.outputs.docs_path }}
          DIAGRAM_FILENAME: ${{ steps.diagram_config.outputs.diagram_filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DOCS_PATH/$DIAGRAM_FILENAME" "$DOCS_PATH/README.md"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Terraform diagram"
            git push
          fi
