name: Generate Terraform Diagram

permissions: {}

on:
  push:
    branches: [main] #This will just find the highest tf env in /environments/<env> and generate 1 diagram
  workflow_dispatch:
    inputs:
      terraform-directory:
        description: "Path to the Terraform root module"
        required: false
        type: string
        default: "."
      docs-path:
        description: "Directory (relative to repo root) to write the diagram into"
        required: false
        type: string
        default: "docs"
      diagram-filename:
        description: "Output filename for the rendered diagram"
        required: false
        type: string
        default: "terraform-diagram.svg"
      commit-changes:
        description: "Whether to commit the generated diagram/README changes back to the repo"
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub environment prefix; the job runs in '<environment>-plan'. Defaults to the basename of terraform-directory"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      terraform-directory:
        description: "Path to the Terraform root module"
        required: false
        type: string
        default: "."
      docs-path:
        description: "Directory (relative to repo root) to write the diagram into"
        required: false
        type: string
        default: "docs"
      diagram-filename:
        description: "Output filename for the rendered diagram"
        required: false
        type: string
        default: "terraform-diagram.svg"
      commit-changes:
        description: "Whether to commit the generated diagram/README changes back to the repo"
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub environment prefix; the job runs in '<environment>-plan'. Defaults to the basename of terraform-directory"
        required: false
        type: string
        default: ""

jobs:
  config:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      terraform_directory: ${{ steps.diagram_config.outputs.terraform_directory }}
      docs_path: ${{ steps.diagram_config.outputs.docs_path }}
      diagram_filename: ${{ steps.diagram_config.outputs.diagram_filename }}
      commit_changes: ${{ steps.diagram_config.outputs.commit_changes }}
      environment: ${{ steps.diagram_config.outputs.environment }}
    steps:
      # `inputs.*` are empty on push events, so every value used later is
      # resolved here (push defaults vs. dispatch/call inputs) and exposed as a step output.
      - name: Resolve diagram configuration
        id: diagram_config
        shell: bash
        env:
          TF_ENVIRONMENTS: ${{ vars.TF_ENVIRONMENTS }}
          INPUT_TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
          INPUT_DOCS_PATH: ${{ inputs.docs-path }}
          INPUT_DIAGRAM_FILENAME: ${{ inputs.diagram-filename }}
          INPUT_COMMIT_CHANGES: ${{ inputs.commit-changes }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            environment="$(python3 -c 'import json, os; print(json.loads(os.environ["TF_ENVIRONMENTS"])[-1])')"
            if [[ "$environment" == environments/* ]]; then
              terraform_directory="$environment"
            else
              terraform_directory="environments/$environment"
            fi
            docs_path="docs"
            diagram_filename="${environment##*/}-terraform-diagram.svg"
            commit_changes="true"
            environment_name="${environment##*/}"
          else
            terraform_directory="${INPUT_TERRAFORM_DIRECTORY:-.}"
            docs_path="${INPUT_DOCS_PATH:-docs}"
            diagram_filename="${INPUT_DIAGRAM_FILENAME:-terraform-diagram.svg}"
            commit_changes="${INPUT_COMMIT_CHANGES:-true}"
            environment_name="${INPUT_ENVIRONMENT:-$(basename "$terraform_directory")}"
          fi

          if [[ -z "$environment_name" || "$environment_name" == "." ]]; then
            echo "::error::Could not determine the GitHub environment name. Pass the 'environment' input."
            exit 1
          fi

          if [[ -z "$terraform_directory" ]]; then
            echo "::error::terraform_directory resolved to an empty value. Check that the TF_ENVIRONMENTS repo variable exists and is valid JSON, e.g. [\"dev\",\"prod\"]."
            exit 1
          fi

          echo "terraform_directory=$terraform_directory" >> "$GITHUB_OUTPUT"
          echo "docs_path=$docs_path" >> "$GITHUB_OUTPUT"
          echo "diagram_filename=$diagram_filename" >> "$GITHUB_OUTPUT"
          echo "commit_changes=$commit_changes" >> "$GITHUB_OUTPUT"
          echo "environment=$environment_name" >> "$GITHUB_OUTPUT"

          echo "terraform_directory='$terraform_directory'"
          echo "docs_path='$docs_path'"
          echo "diagram_filename='$diagram_filename'"
          echo "commit_changes='$commit_changes'"
          echo "environment='$environment_name'"

  generate-diagram:
    needs: config
    runs-on: ubuntu-latest
    # Same GitHub environment as the plan workflow, so its secrets/vars are available.
    # NOTE: any protection rules / required reviewers on that environment apply here too.
    environment: ${{ needs.config.outputs.environment }}-plan
    permissions:
      contents: write
      # id-token: write   # uncomment if you authenticate with OIDC (ARM_USE_OIDC)
    env:
      TF_IN_AUTOMATION: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_INPUT: 0
      TF_VAR_ci_run: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tf-setup
      # Use a local backend so no remote state access is needed (runner-only file, never committed).
      - name: Init Terraform with local backend override (diagram only)
        working-directory: ${{ needs.config.outputs.terraform_directory }}
        run: |
          cat > backend_override.tf << 'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init -input=false

      # The plan gives us each resource's real type/name (incl. azapi_resource's Azure type);
      # `terraform graph` gives the dependencies. Both stay on the runner (plan may contain secrets).
      - name: Plan and export JSON + dependency graph
        working-directory: ${{ needs.config.outputs.terraform_directory }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock=false -out=tfplan
          terraform show -json tfplan > plan.json
          terraform graph > graph.dot
          echo "plan.json: $(wc -c < plan.json) bytes, graph.dot: $(wc -l < graph.dot) lines"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Build and render diagram
        env:
          TF_DIR: ${{ needs.config.outputs.terraform_directory }}
          DOCS_PATH: ${{ needs.config.outputs.docs_path }}
          DIAGRAM_FILENAME: ${{ needs.config.outputs.diagram_filename }}
          ENVIRONMENT: ${{ needs.config.outputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCS_PATH"

          python3 .github/scripts/tf_diagram.py \
            --plan "$TF_DIR/plan.json" \
            --graph "$TF_DIR/graph.dot" \
            --title "Terraform: $ENVIRONMENT" \
            --out diagram.dot

          dot -Tsvg diagram.dot -o "$DOCS_PATH/$DIAGRAM_FILENAME"

          if [[ ! -s "$DOCS_PATH/$DIAGRAM_FILENAME" ]]; then
            echo "::error::$DOCS_PATH/$DIAGRAM_FILENAME is missing or empty."
            exit 1
          fi
          ls -l "$DOCS_PATH/$DIAGRAM_FILENAME"

      - name: Ensure README references the diagram
        env:
          DOCS_PATH: ${{ needs.config.outputs.docs_path }}
          DIAGRAM_FILENAME: ${{ needs.config.outputs.diagram_filename }}
        run: |
          README="$DOCS_PATH/README.md"
          # README sits next to the SVG, so link relatively
          DOC_LINK="./$DIAGRAM_FILENAME"
          MARKER="<!-- terraform-diagram:start -->"

          [ -f "$README" ] || touch "$README"

          if grep -qF "$MARKER" "$README"; then
            echo "README already has a terraform-diagram section; leaving as-is."
          else
            {
              echo "## Diagram"
              echo "$MARKER"
              echo "Auto-generated from Terraform. Do not edit manually."
              echo ""
              echo "![Terraform diagram]($DOC_LINK)"
              echo "<!-- terraform-diagram:end -->"
            } >> "$README"
            echo "Injected diagram reference into $README"
          fi

      - name: Commit changes
        if: ${{ needs.config.outputs.commit_changes == 'true' }}
        env:
          DOCS_PATH: ${{ needs.config.outputs.docs_path }}
          DIAGRAM_FILENAME: ${{ needs.config.outputs.diagram_filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DOCS_PATH/$DIAGRAM_FILENAME" "$DOCS_PATH/README.md"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Terraform diagram"
            git push
          fi
