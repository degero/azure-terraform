name: Generate Terraform Diagram

on:
  workflow_call:
    inputs:
      terraform-directory:
        description: "Path to the Terraform root module"
        required: false
        type: string
        default: "."
      docs-path:
        description: "Directory (relative to repo root) to write the diagram into"
        required: false
        type: string
        default: "docs"
      diagram-filename:
        description: "Output filename for the rendered diagram"
        required: false
        type: string
        default: "terraform-diagram.svg"
      commit-changes:
        description: "Whether to commit the generated diagram/README changes back to the repo"
        required: false
        type: boolean
        default: true

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
      - uses: ./.github/actions/tf-init
        with:
          working_directory: ${{ env.WORKING_DIR }}
          no_backend: "true"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Terraform graph (DOT)
        working-directory: ${{ inputs.terraform-directory }}
        run: terraform graph > graph.dot

      - name: Convert DOT graph to Mermaid syntax
        run: |
          python3 - "${{ inputs.terraform-directory }}/graph.dot" > diagram.mmd << 'PYEOF'
          import re, sys

          dot_path = sys.argv[1]
          with open(dot_path) as f:
              dot = f.read()

          # Extract edges of the form: "node_a" -> "node_b"
          edge_re = re.compile(r'"([^"]+)"\s*->\s*"([^"]+)"')
          edges = edge_re.findall(dot)

          def clean(label: str) -> str:
              # Strip terraform graph noise, keep resource address readable
              label = label.split(" (expand)")[0]
              label = re.sub(r'[^A-Za-z0-9_\.\[\]/-]', '_', label)
              return label

          def node_id(label: str) -> str:
              return re.sub(r'[^A-Za-z0-9_]', '_', label)

          print("flowchart LR")
          seen_nodes = set()
          for src, dst in edges:
              src_c, dst_c = clean(src), clean(dst)
              src_id, dst_id = node_id(src_c), node_id(dst_c)
              for nid, label in ((src_id, src_c), (dst_id, dst_c)):
                  if nid not in seen_nodes:
                      seen_nodes.add(nid)
                      print(f'    {nid}["{label}"]')
              print(f"    {src_id} --> {dst_id}")
          PYEOF

      - name: Install mermaid-cli (mermaid engine built from mermaid-js/mermaid@main)
        run: |
          mkdir -p /tmp/mermaid-render
          cd /tmp/mermaid-render
          cat > package.json << 'EOF'
          {
            "name": "mermaid-render",
            "private": true,
            "dependencies": {
              "@mermaid-js/mermaid-cli": "latest"
            },
            "overrides": {
              "mermaid": "github:mermaid-js/mermaid#main"
            }
          }
          EOF
          npm install --no-fund --no-audit

      - name: Render diagram to SVG
        run: |
          mkdir -p "${{ inputs.docs-path }}"
          /tmp/mermaid-render/node_modules/.bin/mmdc \
            -i diagram.mmd \
            -o "${{ inputs.docs-path }}/${{ inputs.diagram-filename }}" \
            -b transparent

      - name: Ensure README references the diagram
        run: |
          README="${{ inputs.docs-path }}/README.md"
          DOC_LINK="/${{ inputs.diagram-filename }}"
          MARKER="<!-- terraform-diagram:start -->"

          [ -f "$README" ] || touch "$README"

          if grep -qF "$MARKER" "$README"; then
            echo "README already has a terraform-diagram section; leaving as-is."
          else
            {
              echo ""
              echo "$MARKER"
              echo "Auto-generated from Terraform. Do not edit manually."
              echo ""
              echo "![Terraform diagram]($DOC_LINK)"
              echo "<!-- terraform-diagram:end -->"
            } >> "$README"
            echo "Injected diagram reference into README.md"
          fi

      - name: Commit changes
        if: ${{ inputs.commit-changes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.docs-path }}/${{ inputs.diagram-filename }}" README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Terraform diagram"
            git push
          fi
