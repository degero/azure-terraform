name: Terraform Apply

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        type: string
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  WORKING_DIR: ./environments/${{ inputs.environment }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve Azure identity for environment
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ENV_UPPER=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          CLIENT_ID_KEY="AZURE_CLIENT_ID_${ENV_UPPER}"
          SUB_ID_KEY="AZURE_SUBSCRIPTION_ID_${ENV_UPPER}"

          CLIENT_ID=$(echo "$ALL_VARS" | jq -r --arg k "$CLIENT_ID_KEY" '.[$k] // empty')
          SUB_ID=$(echo "$ALL_VARS" | jq -r --arg k "$SUB_ID_KEY" '.[$k] // empty')

          if [ -z "$CLIENT_ID" ] || [ -z "$SUB_ID" ]; then
            echo "::error::No Azure config found for environment '$ENVIRONMENT' (expected variables $CLIENT_ID_KEY / $SUB_ID_KEY)"
            exit 1
          fi

          echo "AZURE_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "AZURE_SUBSCRIPTION_ID=$SUB_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-init
        with:
          working_directory: ${{ env.WORKING_DIR }}
      - name: Upload plan to blob storage
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ env.TFPLAN_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}/tfplan" \
            --file tfplan \
            --overwrite
      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
