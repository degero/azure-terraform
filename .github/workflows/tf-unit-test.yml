name: Terraform Unit Tests

on:
  workflow_call:

permissions: {}

jobs:
  terraform-unit-tests:
    name: Terraform Unit Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tf-setup
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Terraform unit tests
        run: bash scripts/tf-unit-test.sh true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-reports
          path: |
            modules/**/results.xml
            modulegroups/**/results.xml
      - name: Publish Terraform test report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d #v6.5.0
        with:
          report_paths: |
            modules/**/results.xml
            modulegroups/**/results.xml
