name: Generate docs

on:
  push:
    branches: [main] #This will just find the highest tf env in /environments/<env> and generate 1 diagram
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          ssh-key: ${{ secrets.DOCO_DEPLOY_KEY }}

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: "0.18.0"
        run: bash scripts/actions/install-terraform-docs.sh

      - name: Generate documentation
        shell: bash
        run: bash scripts/generate-docs.sh

      - name: Format generated documentation
        run: npx prettier --write "docs/**/*.md"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: update terraform docs"
          git pull --rebase
          git push
