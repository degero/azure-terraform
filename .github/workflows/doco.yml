name: Generate docs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TERRAFORM_DOCS_VERSION: "0.20.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install terraform-docs
        run: bash scripts/actions/install-terraform-docs.sh

      - name: Generate consolidated docs/README.md
        run: bash scripts/actions/generate-docs.sh

      - name: Commit and push docs changes
        run: bash scripts/actions/commit-docs.sh
