name: Generate docs

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: "0.18.0"
        run: bash scripts/actions/install-terraform-docs.sh

      - name: Generate documentation
        shell: bash
        run: bash scripts/generate-docs.sh

      - name: Set up Infracost
        if: hashFiles('environments/**/*.tf') != ''
        uses: infracost/actions/setup@v5
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Add environment cost estimates
        if: hashFiles('environments/**/*.tf') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo "# Estimated monthly costs"
            echo
            echo "| Environment | Estimated monthly cost |"
            echo "|---|---:|"
            for dir in environments/*; do
              [ -d "$dir" ] || continue
              json_file="$(mktemp)"
              infracost breakdown --path "$dir" --format json --out-file "$json_file" >/dev/null
              currency="$(jq -r '.currency // "USD"' "$json_file")"
              cost="$(jq -r '.totalMonthlyCost // 0' "$json_file")"
              printf "| \`%s\` | %s %.2f |\n" "${dir##*/}" "$currency" "$cost"
              rm -f "$json_file"
            done
          } > docs/infracost.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: update terraform docs"
          git pull --rebase
          git push
