name: Generate docs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Docs — environments
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c #v1.4.1
        with:
          find-dir: environments
          output-file: docs/README.md
          output-method: inject
          git-push: "false"

      - name: Check for modulegroups directory
        id: check_modulegroups
        run: |
          if [ -d "modulegroups" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docs — module groups
        if: steps.check_modulegroups.outputs.exists == 'true'
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c #v1.4.1
        with:
          find-dir: modulegroups
          output-file: docs/README.md
          output-method: inject
          git-push: "false"

      - name: Docs — shared modules
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c #v1.4.1
        with:
          find-dir: modules
          output-file: docs/README.md
          output-method: inject
          git-push: "false"

      - name: Commit and push docs changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "terraform-docs: automated docs update"
            git push
          else
            echo "No doc changes to commit."
          fi
