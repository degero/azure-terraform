name: Generate docs

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Render terraform docs in /docs and push changes back to PR branch
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c #v1.4.1
        with:
          find-dir: .
          recursive: true
          output-file: docs/README.md
          output-method: inject
          git-push: "true"
