name: Terraform Unit Tests

on:
  workflow_call:

permissions: {}

jobs:
  terraform-unit-tests:
    name: Terraform Unit Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tf-setup
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Detect Terraform test files
        id: detect
        run: |
          {
            echo 'report_paths<<EOF'
            echo 'modules/**/results.xml'
            if [ -d modulegroups ] && [ -n "$(find modulegroups -name '*.tftest.hcl' -print -quit)" ]; then
              echo 'modulegroups/**/results.xml'
            fi
            if [ -n "$(find . \( -path ./modules -o -path ./modulegroups -o -path ./.git -o -path ./.terraform -o -path ./.terraform-cache \) -prune -o -name '*.tftest.hcl' -print -quit)" ]; then
              echo 'results.xml'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Terraform unit tests
        run: bash scripts/tf-test.sh true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-reports
          path: ${{ steps.detect.outputs.report_paths }}
          retention-days: 1
      - name: Publish Terraform test report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d #v6.5.0
        with:
          report_paths: ${{ steps.detect.outputs.report_paths }}
          commit: ${{ github.event.pull_request.head.sha }}
          include_passed: true
          detailed_summary: true
          check_name: Terraform Unit Test Report
          comment: true
          pr_id: ${{ github.event.workflow_run.pull_requests[0].number }}
