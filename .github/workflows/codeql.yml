on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 2 * * 5"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    strategy:
      matrix:
        include:
          - language: actions
            build-mode: none
          # keep/add any other languages you already scan
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
