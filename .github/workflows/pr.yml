name: PR

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - "modulegroups/**"
      - "tests/**"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  shared:
    uses: ./.github/workflows/_shared.yml

  plan:
    needs: shared
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/tf-plan.yml
    strategy:
      matrix:
        environment: ${{ fromJSON(vars.TF_ENVIRONMENTS) }}
    with:
      environment: ${{ matrix.environment }}
  doco:
    needs: paln
    permissions:
      contents: write
    uses: ./.github/workflows/doco.yml
  # If you want to apply to dev on PRs
  # TODO comment out
  apply: # apply to lowest environment only
    needs: plan
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tf-apply.yml
    with:
      environment: ${{ fromJSON(vars.TF_ENVIRONMENTS)[0] }}
