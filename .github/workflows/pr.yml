name: PR

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  shared:
    uses: ./.github/workflows/_shared.yml

  plan-dev:
    needs: shared
    uses: ./.github/workflows/tf-plan-apply.yml
    with:
      environment: "dev"
      noapply: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  doco:
    needs: plan-dev
    uses: ./.github/workflows/doco.yml
