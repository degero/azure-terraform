name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
      actions: read # for private repo
      security-events: write
    uses: ./.github/workflows/checks.yml

  plan:
    name: Terraform Plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    uses: degero/azure-terraform/.github/workflows/tf-plan.yml@main
    strategy:
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(vars.TF_ENVIRONMENTS) }}
    with:
      environment: ${{ matrix.environment }}
  # If you want terraform apply to your first (lowest) env on PRs
  apply:
    if: ${{ vars.PR_TF_APPLY == 'true' }}
    needs: [plan, checks]
    name: Terraform Apply
    permissions:
      contents: read
      id-token: write
    uses: degero/azure-terraform/.github/workflows/tf-apply.yml@main
    with:
      environment: ${{ fromJSON(vars.TF_ENVIRONMENTS)[0] }} #tf-plan.yml has plan_blob_name but using this deterministic for parallel changes
      plan_blob_name: ${{ github.repository }}/${{ fromJSON(vars.TF_ENVIRONMENTS)[0] }}/${{ github.run_id }}-${{ github.run_attempt }}/tfplan
