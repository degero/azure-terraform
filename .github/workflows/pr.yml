name: PR

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  shared:
    uses: ./.github/workflows/_shared.yml

  plan:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    needs: shared
    uses: ./.github/workflows/tf-plan.yml
    strategy:
      max-parallel: 1 # run dev before test, and only if dev passes
      matrix:
        environment: [dev, test] # Add more envs as needed
    with:
      environment: ${{ matrix.environment }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  doco:
    permissions:
      contents: write
    needs: plan
    uses: ./.github/workflows/doco.yml
