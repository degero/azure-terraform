name: PR

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**/*.tf"
      - "environments/**/*.tfvars"
      - "environments/**/*.hcl"
      - "modules/**/*.tf"
      - "modulegroups/**/*.tf"
      - ".github/workflows/pr.yml"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
      actions: read # for private repo
      security-events: write
      pull-requests: write # For test reports
    uses: ./.github/workflows/checks.yml

