name: Terraform Init
description: Initializes Terraform against the shared remote backend and target root module in 'environments'

inputs:
  no_backend:
    description: Skip remote backend config (local-only init, e.g. for validate)
    required: false
    default: "false"
  working_directory:
    description: Directory containing the Terraform config
    required: false
    default: "."

runs:
  using: composite
  env:
    TF_INPUT: 0
  steps:
    - name: Terraform Setup
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        if [ "${{ inputs.no_backend }}" = "true" ]; then
          terraform init -backend=false
        else
          terraform init -backend-config="backend.hcl"
        fi
