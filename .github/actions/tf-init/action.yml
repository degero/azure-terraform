name: Terraform Init
description: Initializes Terraform against the shared remote backend and target root module in 'environments'

inputs:
  no_backend:
    description: Skip remote backend config (local-only init, e.g. for validate)
    required: false
    default: "false"
  working_directory:
    description: Directory containing the Terraform config
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        if [ "${{ inputs.no_backend }}" = "true" ]; then
          terraform init -input=false -backend=false
        else
          terraform init -input=false -backend-config="backend.hcl"
        fi
